<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <defs>
    <!-- Shared paints · HEAT v3 cyan+gold -->
    <linearGradient id="g2-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff6d0"/>
      <stop offset="45%" stop-color="#ffe08a"/>
      <stop offset="100%" stop-color="#f5c542"/>
    </linearGradient>
    <linearGradient id="g2-cyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8faff"/>
      <stop offset="45%" stop-color="#8ae0f2"/>
      <stop offset="100%" stop-color="#5ec8e0"/>
    </linearGradient>
    <linearGradient id="g2-pink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff0fa"/>
      <stop offset="45%" stop-color="#f0b8e0"/>
      <stop offset="100%" stop-color="#e8a0d0"/>
    </linearGradient>
    <linearGradient id="g2-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8ffe8"/>
      <stop offset="45%" stop-color="#a8f0b8"/>
      <stop offset="100%" stop-color="#8ee8a0"/>
    </linearGradient>
    <linearGradient id="g2-bevel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.55)"/>
      <stop offset="40%" stop-color="rgba(255,255,255,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.35)"/>
    </linearGradient>
    <filter id="g2-bloom-gold" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="g2-bloom-cyan" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- ==== HUB · 12 tile marks ==== -->
    <!-- Today · forged sun -->
    <symbol id="g2-today" viewBox="0 0 32 32">
      <circle cx="16" cy="16" r="5.2" fill="none" stroke="url(#g2-gold)" stroke-width="1.9"/>
      <circle cx="16" cy="16" r="2.2" fill="url(#g2-gold)" opacity="0.95"/>
      <g stroke="url(#g2-gold)" stroke-width="1.75" stroke-linecap="round" filter="url(#g2-bloom-gold)">
        <line x1="16" y1="3.2" x2="16" y2="7.2"/>
        <line x1="16" y1="24.8" x2="16" y2="28.8"/>
        <line x1="3.2" y1="16" x2="7.2" y2="16"/>
        <line x1="24.8" y1="16" x2="28.8" y2="16"/>
        <line x1="6.8" y1="6.8" x2="9.6" y2="9.6"/>
        <line x1="22.4" y1="22.4" x2="25.2" y2="25.2"/>
        <line x1="25.2" y1="6.8" x2="22.4" y2="9.6"/>
        <line x1="9.6" y1="22.4" x2="6.8" y2="25.2"/>
      </g>
    </symbol>

    <!-- Week · 7-cell strip grid -->
    <symbol id="g2-week" viewBox="0 0 32 32">
      <rect x="3.5" y="8" width="25" height="16" rx="3" fill="none" stroke="url(#g2-cyan)" stroke-width="1.7"/>
      <line x1="7.5" y1="8" x2="7.5" y2="24" stroke="url(#g2-cyan)" stroke-width="1.2" opacity="0.7"/>
      <line x1="11.5" y1="8" x2="11.5" y2="24" stroke="url(#g2-cyan)" stroke-width="1.2" opacity="0.7"/>
      <line x1="15.5" y1="8" x2="15.5" y2="24" stroke="url(#g2-gold)" stroke-width="1.6"/>
      <line x1="19.5" y1="8" x2="19.5" y2="24" stroke="url(#g2-cyan)" stroke-width="1.2" opacity="0.7"/>
      <line x1="23.5" y1="8" x2="23.5" y2="24" stroke="url(#g2-cyan)" stroke-width="1.2" opacity="0.7"/>
      <rect x="13.6" y="10.2" width="3.8" height="11.6" rx="1" fill="url(#g2-gold)" opacity="0.85" filter="url(#g2-bloom-gold)"/>
    </symbol>

    <!-- Month · calendar block -->
    <symbol id="g2-month" viewBox="0 0 32 32">
      <rect x="5" y="7" width="22" height="19" rx="3.2" fill="none" stroke="url(#g2-gold)" stroke-width="1.75"/>
      <line x1="5" y1="12.5" x2="27" y2="12.5" stroke="url(#g2-cyan)" stroke-width="1.5"/>
      <line x1="11" y1="5.5" x2="11" y2="9.5" stroke="url(#g2-gold)" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="21" y1="5.5" x2="21" y2="9.5" stroke="url(#g2-gold)" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="11" cy="17.5" r="1.35" fill="url(#g2-cyan)"/>
      <circle cx="16" cy="17.5" r="1.35" fill="url(#g2-gold)"/>
      <circle cx="21" cy="17.5" r="1.35" fill="url(#g2-cyan)"/>
      <circle cx="11" cy="22.2" r="1.35" fill="url(#g2-cyan)"/>
      <circle cx="16" cy="22.2" r="1.35" fill="url(#g2-cyan)"/>
    </symbol>

    <!-- Chores · forged check -->
    <symbol id="g2-chores" viewBox="0 0 32 32">
      <rect x="4.5" y="4.5" width="23" height="23" rx="6" fill="none" stroke="url(#g2-gold)" stroke-width="1.75"/>
      <path d="M9.5 16.2 L14.2 21 L23 11.2" fill="none" stroke="url(#g2-gold)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" filter="url(#g2-bloom-gold)"/>
    </symbol>

    <!-- Groceries · crate/grid basket -->
    <symbol id="g2-groceries" viewBox="0 0 32 32">
      <rect x="5" y="10" width="22" height="15" rx="2.5" fill="none" stroke="url(#g2-gold)" stroke-width="1.75"/>
      <path d="M9 10 V7.5 Q9 5.5 11 5.5 H21 Q23 5.5 23 7.5 V10" fill="none" stroke="url(#g2-cyan)" stroke-width="1.6"/>
      <line x1="12.5" y1="10" x2="12.5" y2="25" stroke="url(#g2-cyan)" stroke-width="1.2" opacity="0.65"/>
      <line x1="19.5" y1="10" x2="19.5" y2="25" stroke="url(#g2-cyan)" stroke-width="1.2" opacity="0.65"/>
      <line x1="5" y1="16.5" x2="27" y2="16.5" stroke="url(#g2-gold)" stroke-width="1.2" opacity="0.55"/>
    </symbol>

    <!-- Reward jar · star in ring -->
    <symbol id="g2-jar" viewBox="0 0 32 32">
      <path d="M11 7.5 H21 L22.5 10.5 H9.5 Z" fill="none" stroke="url(#g2-gold)" stroke-width="1.55" stroke-linejoin="round"/>
      <path d="M10 10.5 H22 V23.5 Q22 26.5 16 26.5 Q10 26.5 10 23.5 Z" fill="none" stroke="url(#g2-gold)" stroke-width="1.75" stroke-linejoin="round"/>
      <path d="M16 13.2 L17.15 15.55 L19.85 15.85 L17.85 17.65 L18.4 20.3 L16 18.95 L13.6 20.3 L14.15 17.65 L12.15 15.85 L14.85 15.55 Z" fill="url(#g2-gold)" filter="url(#g2-bloom-gold)"/>
    </symbol>
    <symbol id="g2-star" viewBox="0 0 32 32">
      <path d="M16 4.5 L18.55 12.1 L26.5 12.35 L20.15 17.05 L22.3 24.7 L16 20.35 L9.7 24.7 L11.85 17.05 L5.5 12.35 L13.45 12.1 Z" fill="none" stroke="url(#g2-gold)" stroke-width="1.7" stroke-linejoin="round" filter="url(#g2-bloom-gold)"/>
      <circle cx="16" cy="15.2" r="2" fill="url(#g2-gold)" opacity="0.9"/>
    </symbol>

    <!-- Weekend Fun · forged diamond -->
    <symbol id="g2-diamond" viewBox="0 0 32 32">
      <path d="M16 3.8 L28.2 16 L16 28.2 L3.8 16 Z" fill="none" stroke="url(#g2-gold)" stroke-width="1.8" stroke-linejoin="round" filter="url(#g2-bloom-gold)"/>
      <path d="M16 9.2 L22.8 16 L16 22.8 L9.2 16 Z" fill="none" stroke="url(#g2-cyan)" stroke-width="1.45"/>
      <circle cx="16" cy="16" r="1.8" fill="url(#g2-gold)"/>
    </symbol>

    <!-- Family trips · plane -->
    <symbol id="g2-plane" viewBox="0 0 32 32">
      <path d="M4.5 17.2 L14.2 14.6 L27.5 7.8 L22.8 18.5 L19.5 26.2 L16.8 18.8 L10.5 20.6 Z" fill="none" stroke="url(#g2-cyan)" stroke-width="1.7" stroke-linejoin="round" filter="url(#g2-bloom-cyan)"/>
      <path d="M14.2 14.6 L19.8 12.2" stroke="url(#g2-gold)" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="27.5" cy="7.8" r="1.4" fill="url(#g2-gold)"/>
    </symbol>

    <!-- ==== PERSONA MONOGRAMS ==== -->
    <symbol id="g2-hayes" viewBox="0 0 32 32">
      <circle cx="16" cy="16" r="12.2" fill="none" stroke="url(#g2-cyan)" stroke-width="1.85" filter="url(#g2-bloom-cyan)"/>
      <circle cx="16" cy="16" r="9.4" fill="none" stroke="url(#g2-cyan)" stroke-width="1.1" opacity="0.45"/>
      <text x="16" y="21.2" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="900" fill="url(#g2-cyan)">H</text>
    </symbol>
    <symbol id="g2-ainsley" viewBox="0 0 32 32">
      <circle cx="16" cy="16" r="12.2" fill="none" stroke="url(#g2-pink)" stroke-width="1.85" filter="url(#g2-bloom-gold)"/>
      <circle cx="16" cy="16" r="9.4" fill="none" stroke="url(#g2-pink)" stroke-width="1.1" opacity="0.45"/>
      <text x="16" y="21.2" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="900" fill="url(#g2-pink)">A</text>
    </symbol>
    <symbol id="g2-harris" viewBox="0 0 32 32">
      <circle cx="16" cy="16" r="12.2" fill="none" stroke="url(#g2-green)" stroke-width="1.85"/>
      <circle cx="16" cy="16" r="9.4" fill="none" stroke="url(#g2-green)" stroke-width="1.1" opacity="0.45"/>
      <text x="16" y="21.2" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="900" fill="url(#g2-green)">H</text>
    </symbol>
    <symbol id="g2-dad" viewBox="0 0 32 32">
      <circle cx="16" cy="16" r="12.2" fill="none" stroke="url(#g2-gold)" stroke-width="1.85" filter="url(#g2-bloom-gold)"/>
      <circle cx="16" cy="16" r="9.4" fill="none" stroke="url(#g2-gold)" stroke-width="1.1" opacity="0.45"/>
      <text x="16" y="21.2" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="900" fill="url(#g2-gold)">D</text>
    </symbol>

    <!-- ==== IN-BOARD CHROME ==== -->
    <symbol id="g2-check" viewBox="0 0 32 32">
      <path d="M7.5 16.5 L13.2 22.2 L24.8 9.5" fill="none" stroke="url(#g2-gold)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#g2-bloom-gold)"/>
    </symbol>
    <symbol id="g2-pack" viewBox="0 0 32 32">
      <rect x="7" y="9" width="18" height="16" rx="2.5" fill="none" stroke="url(#g2-gold)" stroke-width="1.7"/>
      <path d="M12 9 V7.2 Q12 5.5 16 5.5 Q20 5.5 20 7.2 V9" fill="none" stroke="url(#g2-cyan)" stroke-width="1.5"/>
      <line x1="11" y1="15" x2="21" y2="15" stroke="url(#g2-cyan)" stroke-width="1.4" stroke-linecap="round"/>
      <line x1="11" y1="19.5" x2="18" y2="19.5" stroke="url(#g2-gold)" stroke-width="1.4" stroke-linecap="round"/>
    </symbol>
    <symbol id="g2-home" viewBox="0 0 32 32">
      <path d="M5.5 15 L16 6.2 L26.5 15" fill="none" stroke="url(#g2-gold)" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M9 14.5 V25.2 H23 V14.5" fill="none" stroke="url(#g2-cyan)" stroke-width="1.7" stroke-linejoin="round"/>
      <rect x="13.5" y="18.5" width="5" height="6.7" rx="0.8" fill="none" stroke="url(#g2-gold)" stroke-width="1.4"/>
    </symbol>
    <symbol id="g2-routine" viewBox="0 0 32 32">
      <path d="M8.5 11.5 A9 9 0 1 1 8.8 20.5" fill="none" stroke="url(#g2-cyan)" stroke-width="1.85" stroke-linecap="round"/>
      <path d="M8.5 7.2 L8.5 12.2 L13.2 12.2" fill="none" stroke="url(#g2-gold)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="g2-leave" viewBox="0 0 32 32">
      <circle cx="16" cy="16" r="11" fill="none" stroke="url(#g2-gold)" stroke-width="1.75"/>
      <path d="M16 9.5 V16.5 L21 19.2" fill="none" stroke="url(#g2-cyan)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="16" cy="16" r="1.5" fill="url(#g2-gold)"/>
    </symbol>
    <symbol id="g2-target" viewBox="0 0 32 32">
      <circle cx="16" cy="16" r="11" fill="none" stroke="url(#g2-cyan)" stroke-width="1.6"/>
      <circle cx="16" cy="16" r="6.5" fill="none" stroke="url(#g2-gold)" stroke-width="1.5"/>
      <circle cx="16" cy="16" r="2.2" fill="url(#g2-gold)"/>
    </symbol>
    <symbol id="g2-weather" viewBox="0 0 32 32">
      <circle cx="16" cy="16" r="4.6" fill="none" stroke="url(#g2-cyan)" stroke-width="1.7"/>
      <g stroke="url(#g2-gold)" stroke-width="1.6" stroke-linecap="round">
        <line x1="16" y1="5" x2="16" y2="8"/>
        <line x1="16" y1="24" x2="16" y2="27"/>
        <line x1="5" y1="16" x2="8" y2="16"/>
        <line x1="24" y1="16" x2="27" y2="16"/>
        <line x1="8.2" y1="8.2" x2="10.3" y2="10.3"/>
        <line x1="21.7" y1="21.7" x2="23.8" y2="23.8"/>
        <line x1="23.8" y1="8.2" x2="21.7" y2="10.3"/>
        <line x1="10.3" y1="21.7" x2="8.2" y2="23.8"/>
      </g>
    </symbol>
    <symbol id="g2-done" viewBox="0 0 32 32">
      <circle cx="16" cy="16" r="11.2" fill="none" stroke="url(#g2-gold)" stroke-width="1.7"/>
      <path d="M10 16.2 L14.2 20.4 L22.5 11.5" fill="none" stroke="url(#g2-gold)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="g2-next" viewBox="0 0 32 32">
      <circle cx="16" cy="16" r="11.2" fill="none" stroke="url(#g2-cyan)" stroke-width="1.7" filter="url(#g2-bloom-cyan)"/>
      <path d="M13 10.5 L20.5 16 L13 21.5" fill="none" stroke="url(#g2-gold)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <!-- ==== CONSUME event glyphs ==== -->
    <symbol id="g2-baseball" viewBox="0 0 32 32">
      <circle cx="16" cy="16" r="11" fill="none" stroke="url(#g2-gold)" stroke-width="1.75"/>
      <path d="M9 8.5 Q14 12 14 16 Q14 20 9 23.5" fill="none" stroke="url(#g2-cyan)" stroke-width="1.45"/>
      <path d="M23 8.5 Q18 12 18 16 Q18 20 23 23.5" fill="none" stroke="url(#g2-cyan)" stroke-width="1.45"/>
      <g stroke="url(#g2-gold)" stroke-width="1.2" stroke-linecap="round" opacity="0.85">
        <line x1="11.2" y1="11" x2="12.5" y2="12"/>
        <line x1="11.2" y1="14" x2="12.6" y2="14.5"/>
        <line x1="11.2" y1="17.5" x2="12.6" y2="17"/>
        <line x1="11.5" y1="20.5" x2="12.8" y2="19.5"/>
        <line x1="20.8" y1="11" x2="19.5" y2="12"/>
        <line x1="20.8" y1="14" x2="19.4" y2="14.5"/>
        <line x1="20.8" y1="17.5" x2="19.4" y2="17"/>
        <line x1="20.5" y1="20.5" x2="19.2" y2="19.5"/>
      </g>
    </symbol>
    <symbol id="g2-swim" viewBox="0 0 32 32">
      <path d="M5 14.5 Q8.5 11.5 12 14.5 Q15.5 17.5 19 14.5 Q22.5 11.5 27 14.5" fill="none" stroke="url(#g2-cyan)" stroke-width="1.85" stroke-linecap="round"/>
      <path d="M5 20.5 Q8.5 17.5 12 20.5 Q15.5 23.5 19 20.5 Q22.5 17.5 27 20.5" fill="none" stroke="url(#g2-gold)" stroke-width="1.7" stroke-linecap="round"/>
      <circle cx="16" cy="9" r="2.4" fill="none" stroke="url(#g2-cyan)" stroke-width="1.5"/>
    </symbol>
    <symbol id="g2-flag" viewBox="0 0 32 32">
      <line x1="8" y1="5.5" x2="8" y2="27" stroke="url(#g2-gold)" stroke-width="1.9" stroke-linecap="round"/>
      <path d="M8.8 6.2 H23.5 L20.2 11.5 L23.5 16.8 H8.8 Z" fill="none" stroke="url(#g2-green)" stroke-width="1.7" stroke-linejoin="round"/>
      <line x1="12.5" y1="9.5" x2="18.5" y2="9.5" stroke="url(#g2-cyan)" stroke-width="1.3" stroke-linecap="round"/>
      <line x1="12.5" y1="13.2" x2="17.2" y2="13.2" stroke="url(#g2-gold)" stroke-width="1.3" stroke-linecap="round"/>
    </symbol>

    <!-- Grow accents · Victory / Tour / Gem -->
    <symbol id="g2-victory" viewBox="0 0 32 32">
      <path d="M8 8.5 L12.5 23.5 H19.5 L24 8.5" fill="none" stroke="url(#g2-cyan)" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M11.5 8.5 H20.5" fill="none" stroke="url(#g2-gold)" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="16" cy="26.2" r="1.6" fill="url(#g2-gold)"/>
    </symbol>
    <symbol id="g2-tour" viewBox="0 0 32 32">
      <path d="M7 20.5 Q10 12 16 8.5 Q22 12 25 20.5" fill="none" stroke="url(#g2-pink)" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M9.5 20.5 H22.5" stroke="url(#g2-gold)" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="16" cy="12.5" r="2" fill="url(#g2-pink)"/>
      <path d="M12 24.5 L16 22 L20 24.5" fill="none" stroke="url(#g2-cyan)" stroke-width="1.4" stroke-linecap="round"/>
    </symbol>
    <symbol id="g2-gem" viewBox="0 0 32 32">
      <path d="M10 8.5 H22 L27 14 L16 26.5 L5 14 Z" fill="none" stroke="url(#g2-green)" stroke-width="1.75" stroke-linejoin="round"/>
      <path d="M10 8.5 L16 14 L22 8.5" fill="none" stroke="url(#g2-gold)" stroke-width="1.4"/>
      <path d="M5 14 H27" stroke="url(#g2-cyan)" stroke-width="1.3"/>
      <path d="M16 14 V26.5" stroke="url(#g2-gold)" stroke-width="1.3"/>
    </symbol>
  </defs>
</svg>
