<script>
document.addEventListener("house:kid-rendered", function(){
 var done = document.querySelectorAll(".quest.done").length;
 document.querySelectorAll("[data-craft]").forEach(function(c,i){ c.classList.toggle("on", i < done*2); });
 document.querySelectorAll("[data-hot]").forEach(function(h,i){ h.classList.toggle("lit", i < done); });
});
document.addEventListener("house:cleared", function(){
 document.querySelectorAll("[data-craft]").forEach(function(c){ c.classList.add("on"); });
 document.querySelectorAll("[data-hot]").forEach(function(h){ h.classList.add("lit","sel"); });
});
</script>

<script>
document.addEventListener("DOMContentLoaded", function(){
 if (window.HouseSaves) HouseSaves.mount("harris");
 if (window.HouseLights) HouseLights.mountKidLight("#kid-harris-light", "harris-room");
 if (window.WardKids) WardKids.boot("harris");
 if (window.HouseSfx) HouseSfx.wireMute();

 var got = document.querySelector("[data-got-it]");
 if (got && window.WardKids) {
 got.addEventListener("click", function () {
 var data = WardKids._data;
 var bank = data ? WardKids.getBankView("harris", data) : null;
 var weekEarn = bank ? bank.weekEarn : 0;
 var bal = bank ? bank.balance : 0;
 var after = bal + weekEarn;
 var def = String(weekEarn);
 var paidStr = window.prompt(
 "Dad paid how much?\nThis week earn " + weekEarn + " → carry becomes " + after + " − paid.\n0 = keep all as carry into next week.",
 def
 );
 if (paidStr == null) return;
 WardKids.resetJarCycle("harris", paidStr, data);
 if (data) {
 WardKids.syncBankFromChecks(data);
 var bank2 = WardKids.getBankView("harris", data);
 WardKids.renderBank(document, bank2);
 WardKids.renderPersonalGoal(document, "harris", data, bank2);
 }
 if (window.HouseSfx) HouseSfx.tap();
 });
 }

});
</script>
