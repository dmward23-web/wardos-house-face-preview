<script>
/* MONTHS1 · month view for any month (‹ › + pills), data from data/cal-months.json */
(function () {
  var MN = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  var MS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var grid = document.querySelector(".month-grid");
  var DATA = null, cur = null;
  function ctToday() {
    var p = new Intl.DateTimeFormat("en-CA", { timeZone: "America/Chicago", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
    return { y: +p.slice(0, 4), m: +p.slice(5, 7), d: +p.slice(8, 10), iso: p };
  }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function key(y, m, d) { return y + "-" + pad(m) + "-" + pad(d); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function months() {
    var out = [], t = ctToday();
    var s = DATA && DATA.rangeStart ? DATA.rangeStart : key(t.y, t.m, 1);
    var e = DATA && DATA.rangeEnd ? DATA.rangeEnd : key(t.y, t.m, 1);
    var y = +s.slice(0, 4), m = +s.slice(5, 7), ey = +e.slice(0, 4), em = +e.slice(5, 7);
    if (DATA && DATA.days) { /* skip lead months with no real items */
      while ((y < ey || (y === ey && m < em)) && !Object.keys(DATA.days).some(function (k) { return k.slice(0, 7) === y + "-" + pad(m) && DATA.days[k].items.length > 1; })) { m++; if (m > 12) { m = 1; y++; } }
    }
    while (y < ey || (y === ey && m <= em)) { out.push({ y: y, m: m }); m++; if (m > 12) { m = 1; y++; } }
    return out;
  }
  function spans(y, m) {
    var dim = new Date(y, m, 0).getDate(), out = [], run = null;
    for (var d = 1; d <= dim; d++) {
      var day = DATA && DATA.days[key(y, m, d)];
      if (day && day.withDan) { if (!run) run = [d, d]; else run[1] = d; }
      else if (run) { out.push(run); run = null; }
    }
    if (run) out.push(run);
    return out.map(function (r) { return MS[m - 1] + " " + r[0] + (r[1] > r[0] ? "–" + r[1] : ""); });
  }
  function render(y, m) {
    cur = { y: y, m: m };
    var t = ctToday();
    grid.setAttribute("data-year", y); grid.setAttribute("data-month", m);
    document.querySelector("[data-month-title]").textContent = MN[m - 1] + " " + y;
    var first = new Date(y, m - 1, 1).getDay(), dim = new Date(y, m, 0).getDate();
    var weeks = Math.ceil((first + dim) / 7);
    var html = "", start = new Date(y, m - 1, 1 - first), rows = 0, rowMax = [];
    /* SPILL1 (Dan 10/2): spill-over days outside the month show their REAL calendar items, dimmed.
       An empty spill day shrinks to its date; a spill row with nothing at all is dropped. Nothing invented. */
    function dayAt(i) { var dd = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i); return { y: dd.getFullYear(), m: dd.getMonth() + 1, d: dd.getDate() }; }
    function itemsOf(o) { var dd = DATA && DATA.days[key(o.y, o.m, o.d)]; return dd && dd.items ? dd.items : []; }
    for (var i = 0; i < weeks * 7; i++) {
      if (i % 7 === 0) {
        var bare = true;
        for (var j = i; j < i + 7; j++) { var oj = dayAt(j); if (oj.m === m || itemsOf(oj).length) { bare = false; break; } }
        if (bare) { i += 6; continue; }
        rows++;
      }
      var o = dayAt(i), dy = o.y, dm = o.m, dn = o.d;
      if (dm !== m) {
        var oi = itemsOf(o), od = DATA && DATA.days[key(dy, dm, dn)];
        if (oi.length) rowMax[rows - 1] = Math.max(rowMax[rows - 1] || 0, oi.length + (od && od.withDan ? 0.6 : 0));
        if (!oi.length) { html += '<div class="day out empty"><div class="day-top"><span class="dom">' + MS[dm - 1] + " " + dn + "</span></div></div>"; continue; }
        html += '<div class="day out has-items" id="d-' + key(dy, dm, dn) + '"><div class="day-top"><span class="dom">' + MS[dm - 1] + " " + dn + "</span></div>";
        if (od && od.withDan) html += '<div class="mom dan">Kids with Dan</div>';
        html += '<div class="blocks">';
        oi.forEach(function (it) { html += '<div class="blk ' + esc(it.c) + '" title="' + esc(it.l) + '">' + esc(it.l) + "</div>"; });
        html += "</div></div>";
        continue;
      }
      var k = key(dy, dm, dn), day = DATA && DATA.days[k], isToday = k === t.iso, nIt = day && day.items ? day.items.length : 0;
      rowMax[rows - 1] = Math.max(rowMax[rows - 1] || 0, nIt + (day && day.withDan ? 0.6 : 0));
      html += '<a class="day' + (isToday ? " today" : "") + (!nIt && !isToday && !(day && day.withDan) ? " empty" : "") + '" id="d-' + k + '" href="sheet-today.html"><div class="day-top"><span class="dom">' + dn + "</span>" + (isToday ? '<span class="day-tag">today</span>' : "") + "</div>";
      if (day && day.withDan) html += '<div class="mom dan">Kids with Dan</div>';
      html += '<div class="blocks">';
      (day ? day.items : []).forEach(function (it) { html += '<div class="blk ' + esc(it.c) + '" title="' + esc(it.l) + '">' + esc(it.l) + "</div>"; });
      html += "</div></a>";
    }
    grid.style.gridTemplateRows = "repeat(" + rows + ", 1fr)";
    grid.innerHTML = html; lastRows = rowMax.slice(0, rows); fit();
    var sp = spans(y, m);
    document.querySelector("[data-month-banner]").textContent = sp.length ? "Kids with Dan · " + sp.join(" · ") : "No Kids-with-Dan days on the calendar this month";
    var list = months(), idx = list.findIndex(function (x) { return x.y === y && x.m === m; });
    document.querySelector('[data-mnav="-1"]').disabled = idx <= 0;
    document.querySelector('[data-mnav="1"]').disabled = idx < 0 || idx >= list.length - 1;
    document.querySelector("[data-month-pills]").innerHTML = list.map(function (x) {
      return '<button type="button" class="mpill' + (x.y === y && x.m === m ? " on" : "") + '" data-ym="' + x.y + "-" + x.m + '">' + MS[x.m - 1] + (x.y !== t.y ? " " + x.y : "") + "</button>";
    }).join("");
    var r = document.querySelector("[data-month-range]");
    r.textContent = DATA ? "calendar through " + MS[+DATA.rangeEnd.slice(5, 7) - 1] + " " + +DATA.rangeEnd.slice(8, 10) + " · empty = unknown" : "calendar unavailable · empty = unknown";
    /* PRESSMAP1: a wall press can land on one day (#d-YYYY-MM-DD): keep that hash and bring the day into view */
    var dayH = /^#d-(\d{4})-(\d{2})-\d{2}$/.exec(location.hash);
    if (dayH && +dayH[1] === y && +dayH[2] === m) { var cell = document.getElementById(location.hash.slice(1)); if (cell) { cell.classList.add("is-target"); cell.scrollIntoView({ block: "center" }); } }
    else if (location.hash !== "#" + y + "-" + pad(m) && location.hash !== "#month-board") history.replaceState(null, "", "#" + y + "-" + pad(m));
  }
  /* MONTHFIT1: landscape rows by their busiest day; a day that runs out of room shows "+N more" */
  var lastRows = [];
  function landOn() { return !!(g0.HouseLandscape && g0.HouseLandscape.active() && document.querySelector(".panel[data-ls-grid]")); }
  function fit() {
    var on = landOn();
    /* the footer's one chip sits under the leave-by card (no near-empty strip under the month) */
    var pnl = document.querySelector(".panel"), chip = document.querySelector(".ftr-chip"), mw = document.getElementById("month-board"), fl = document.querySelector(".ftr .ftr-left");
    if (chip && mw && fl && pnl) {
      var up = on && fl.children.length + (chip.parentNode === pnl ? 1 : 0) === 1 && !fl.textContent.replace(chip.textContent, "").trim();
      if (up && chip.parentNode !== pnl) pnl.insertBefore(chip, mw);
      if (!up && chip.parentNode === pnl) fl.appendChild(chip);
      pnl.classList.toggle("mf-ftr-up", up);
    }
    /* the leave-by card beside the header takes the largest type that still fits in the header's height */
    var lb = document.querySelector(".panel > .leaveby"), lbb = lb && lb.querySelector(".leaveby-body"), hd = document.querySelector(".panel > .hdr");
    if (lbb) {
      lbb.style.removeProperty("zoom");
      var h0 = hd ? hd.getBoundingClientRect().height : 0;
      if (on && hd) for (var q = 2.4; q > 1.04; q = q / 1.06) {
        lbb.style.zoom = String(q);
        var okH = lb.getBoundingClientRect().height + (chip && chip.parentNode === pnl ? chip.getBoundingClientRect().height + 10 : 0) <= h0 + 1, okW = lb.scrollWidth <= lb.clientWidth + 1 && lbb.scrollWidth <= lbb.clientWidth + 1;
        if (okH && okW && (!g0.HouseLandscape.fitsIn || g0.HouseLandscape.fitsIn(lb))) break;
        lbb.style.removeProperty("zoom");
      }
    }
    /* CLIP1b · every week row keeps room for its date, the kids line and one whole "+N more" chip (72px) */
    grid.style.gridTemplateRows = on && lastRows.length ? lastRows.map(function (n) { return "minmax(72px, " + (Math.max(0, n) + 1.3).toFixed(1) + "fr)"; }).join(" ") : "repeat(" + Math.max(1, lastRows.length) + ", 1fr)";
    Array.prototype.forEach.call(grid.querySelectorAll(".blocks"), function (b) {
      var m = b.querySelector(".blk-more"); if (m) b.removeChild(m);
      var ks = b.querySelectorAll(".blk"); Array.prototype.forEach.call(ks, function (k) { k.style.removeProperty("display"); });
      if (b.scrollHeight <= b.clientHeight + 1) return; /* CLIP1: whole items only, the rest is "+N more" (any layout) */
      var more = document.createElement("div"); more.className = "blk blk-more"; b.appendChild(more);
      for (var shown = ks.length - 1; shown >= 0; shown--) {
        ks[shown].style.display = "none"; more.textContent = "+" + (ks.length - shown) + " more";
        if (b.scrollHeight <= b.clientHeight + 1) break;
      }
    });
  }
  var g0 = window, ft = 0;
  function refit() { cancelAnimationFrame(ft); ft = requestAnimationFrame(fit); }
  g0.addEventListener("resize", refit, { passive: true }); g0.addEventListener("load", refit);
  if (g0.ResizeObserver) { var gh = 0; new ResizeObserver(function () { var h = grid.getBoundingClientRect().height; if (Math.abs(h - gh) > 1) { gh = h; refit(); } }).observe(grid); }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(refit);
  document.addEventListener("DOMContentLoaded", refit);
  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-mnav]");
    if (b && cur) { var list = months(), i = list.findIndex(function (x) { return x.y === cur.y && x.m === cur.m; }) + +b.getAttribute("data-mnav"); if (list[i]) render(list[i].y, list[i].m); return; }
    var p = e.target.closest("[data-ym]");
    if (p) { var v = p.getAttribute("data-ym").split("-"); render(+v[0], +v[1]); }
  });
  function initial() {
    var h = /^#(?:d-)?(\d{4})-(\d{2})(?:-\d{2})?$/.exec(location.hash), t = ctToday();
    return h ? { y: +h[1], m: +h[2] } : { y: t.y, m: t.m };
  }
  var s0 = initial(); render(s0.y, s0.m);
  fetch("data/cal-months.json?t=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.ok ? r.json() : null; }).then(function (d) {
    if (d && d.days) DATA = d;
    render(cur.y, cur.m);
  }).catch(function () { render(cur.y, cur.m); });
  setInterval(function () { if (cur) render(cur.y, cur.m); }, 10 * 60 * 1000);
})();
</script>
