<body>
<div class="shell">
  <header class="bar">
    <h1 id="title">Camera</h1>
    <div class="meta" id="proxy-meta" hidden>proxy…</div>
    <div class="dbg" hidden>
      <button type="button" id="btn-stop">Stop</button>
      <button type="button" class="loud" id="btn-start">Start</button>
    </div>
  </header>
  <div class="stage">
    <div class="hud">
      <span class="pill dim" id="live-pill"><i></i>IDLE</span>
      <div class="status" id="status">Ready · tap a cam</div>
    </div>
    <video id="vid" playsinline muted autoplay></video>
    <img id="still-fallback" class="still-fallback" alt="Nest still" />
    <div class="errbox" id="errbox"></div>
  </div>
  <div class="cams" id="cam-row" aria-label="Cameras" hidden></div>
</div>
<script src="nest-webrtc-client.js?v=PROXYFOLLOW2"></script>

<script>
(function () {
  var N = window.NestWebRtc;
  var vid = document.getElementById("vid");
  var statusEl = document.getElementById("status");
  var pill = document.getElementById("live-pill");
  var errbox = document.getElementById("errbox");
  var row = document.getElementById("cam-row");
  var title = document.getElementById("title");
  var proxyMeta = document.getElementById("proxy-meta");
  var session = null;
  var cams = [];
  var activeId = null;

  function setStatus(s) {
    statusEl.textContent = s;
  }
  function setPill(cls, text) {
    pill.className = "pill " + (cls || "");
    pill.innerHTML = "<i></i>" + text;
  }
  function showErr(msg) {
    errbox.textContent = msg;
    errbox.classList.add("show");
    setPill("err", "ERROR");
  }
  function clearErr() {
    errbox.classList.remove("show");
    errbox.textContent = "";
  }

  var stillEl = document.getElementById("still-fallback");
  var stageEl = document.querySelector(".stage");

  function showStillFallback(want) {
    return fetch("data/nest-live.json?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (data) {
        if (!data || !data.cameras) return null;
        var hit = null;
        if (want) {
          hit = data.cameras.find(function (c) {
            return c.id === want || (c.name && c.name.toLowerCase().indexOf(String(want).toLowerCase()) >= 0);
          });
        }
        if (!hit) hit = data.cameras.find(function (c) { return c.snapshotUrl; });
        if (hit && hit.snapshotUrl) {
          stillEl.src = hit.snapshotUrl + (hit.snapshotUrl.indexOf("?") >= 0 ? "&" : "?") + "t=" + Date.now();
          stillEl.classList.add("show");
          vid.style.display = "none";
          if (stageEl) stageEl.classList.add("fail");
          title.textContent = (hit.name || "Nest").replace(/\s+camera$/i, "") + " · STILL";
          return hit;
        }
        return null;
      })
      .catch(function () { return null; });
  }

  async function loadCams() {
    setStatus("loading cameras…");
    var want = new URLSearchParams(location.search).get("cam") ||
      new URLSearchParams(location.search).get("id") ||
      new URLSearchParams(location.search).get("name");
    try {
      if (N.ensureProxyFromLive) await N.ensureProxyFromLive();
      proxyMeta.textContent = "proxy " + (N.proxyBase() || "NEED PROXY") + (N.proxyToken() ? " · authed" : "");
      /* AUDIT1 · no key on this screen → don't call the proxy; say NEED KEY and show the still */
      if (!N.proxyToken()) {
        if (stageEl) stageEl.classList.add("fail");
        setStatus("NEED KEY · live video needs the key on this screen");
        showStillFallback(want).then(function (hit) {
          setPill(hit ? "dim" : "err", hit ? "STILL · NEED KEY" : "NEED KEY");
        });
        return;
      }
      var data = await N.fetchCameras();
      cams = data.cameras || [];
      row.innerHTML = "";
      cams.forEach(function (c) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "cam-btn";
        b.textContent = (c.name || "Cam").replace(/\s+camera$/i, "");
        b.dataset.id = c.id;
        b.addEventListener("click", function () {
          startCam(c.id);
        });
        row.appendChild(b);
      });
      setStatus(cams.length + " cams · tap to stream");
      setPill("dim", "READY");
      if (want) {
        var hit = cams.find(function (c) {
          return c.id === want || (c.name && c.name.toLowerCase().indexOf(want.toLowerCase()) >= 0);
        });
        if (hit) startCam(hit.id);
        else if (cams[0]) startCam(cams[0].id);
      }
    } catch (e) {
      if (stageEl) stageEl.classList.add("fail");
      var msg = (e && e.message) ? e.message : String(e);
      var base = N.proxyBase() || "(none — Pages/phone)";
      showErr(
        "Cannot reach nest-webrtc-proxy at " + base + "\n\n" + msg
      );
      setStatus("NEED PROXY · loading still if any…");
      showStillFallback(want).then(function (hit) {
        if (hit) {
          setPill("dim", "STILL · NEED PROXY");
          setStatus("Showing Nest still · live video needs nestProxy (baked in nest-live.json)");
        } else {
          setPill("err", "NEED PROXY");
          setStatus("NEED PROXY · open sheet-google-home for stills · Atlas: nest-fetch + nest-webrtc-proxy");
        }
      });
    }
  }

  async function startCam(id) {
    clearErr();
    if (session) {
      try { session.stop(); } catch (_) {}
      session = null;
    }
    activeId = id;
    Array.prototype.forEach.call(row.querySelectorAll(".cam-btn"), function (b) {
      b.classList.toggle("on", b.dataset.id === id);
    });
    var cam = cams.find(function (c) { return c.id === id; });
    title.textContent = (cam ? cam.name.replace(/\s+camera$/i, "") : "Nest") + " · live";
    setPill("dim", "CONNECTING");
    setStatus("starting…");
    try {
      session = await N.startStream(id, vid, setStatus);
      setPill("", "LIVE");
      title.textContent = (session.name || title.textContent) + " · LIVE";
      // poll ice until connected / failed
      var n = 0;
      var iv = setInterval(function () {
        n++;
        var st = session && session.pc ? session.pc.iceConnectionState : "?";
        var cst = session && session.pc ? session.pc.connectionState : "?";
        setStatus("ICE " + st + " · PC " + cst + (session.mediaSessionId ? " · session ok" : ""));
        if (st === "connected" || st === "completed" || cst === "connected") {
          setPill("", "LIVE");
          clearInterval(iv);
        } else if (st === "failed" || cst === "failed" || n > 40) {
          if (st === "failed" || cst === "failed") {
            setPill("err", "NO VIDEO");
            showErr("WebRTC ICE failed (" + st + "/" + cst + ").\nSDP exchange succeeded but media path blocked.\nCheck STUN / firewall / cam online.");
          }
          clearInterval(iv);
        }
      }, 500);
    } catch (e) {
      showErr(e && e.message ? e.message : String(e));
    }
  }

  document.getElementById("btn-start").addEventListener("click", function () {
    if (activeId) startCam(activeId);
    else if (cams[0]) startCam(cams[0].id);
  });
  document.getElementById("btn-stop").addEventListener("click", function () {
    if (session) {
      session.stop();
      session = null;
    }
    vid.srcObject = null;
    setPill("dim", "STOPPED");
    setStatus("stopped");
    clearErr();
  });

  loadCams();
})();
</script>
