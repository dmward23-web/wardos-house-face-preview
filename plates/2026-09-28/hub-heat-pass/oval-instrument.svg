<svg xmlns="http://www.w3.org/2000/svg" width="220" height="60" viewBox="0 0 220 60" role="img" aria-label="Instrument oval">
  <defs>
    <linearGradient id="ovalGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1018"/>
      <stop offset="48%" stop-color="#121006"/>
      <stop offset="100%" stop-color="#04060c"/>
    </linearGradient>
    <linearGradient id="ovalCyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8ae0f4"/>
      <stop offset="100%" stop-color="#5ec8e0"/>
    </linearGradient>
    <filter id="ovalBloom" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="2" y="2" width="216" height="56" rx="28" fill="url(#ovalGlass)" stroke="rgba(94,200,224,0.55)" stroke-width="2" filter="url(#ovalBloom)"/>
  <circle cx="30" cy="30" r="18" fill="#0a0e14" stroke="rgba(94,200,224,0.45)" stroke-width="1.5"/>
  <circle cx="30" cy="30" r="6" fill="url(#ovalCyan)" opacity="0.9"/>
  <text x="58" y="24" font-family="Inter,system-ui,sans-serif" font-size="9" font-weight="800" letter-spacing="0.2em" fill="rgba(160,200,220,0.75)">WEATHER</text>
  <text x="58" y="42" font-family="Inter,system-ui,sans-serif" font-size="18" font-weight="900" letter-spacing="-0.04em" fill="#f2f7fb">72°</text>
  <text x="108" y="42" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="650" fill="rgba(200,220,232,0.75)">Clear</text>
</svg>
