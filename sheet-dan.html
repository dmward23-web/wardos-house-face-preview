<script>
(function () {
  function wireOval(sel, degText, label) {
    var oval = document.querySelector(sel);
    if (!oval) return;
    var deg = oval.querySelector(".oval-deg");
    if (!deg) return;
    if (degText == null) {
      oval.setAttribute("data-wired", "0");
      oval.setAttribute("hidden", "");
      oval.classList.add("unwired");
      deg.textContent = "";
      return;
    }
    deg.textContent = degText;
    var ico = oval.querySelector(".oval-ico");
    if (ico && arguments[3]) ico.textContent = arguments[3]; /* AUDIT1 · icon from the same wx state */
    oval.setAttribute("data-wired", "1");
    oval.removeAttribute("hidden");
    oval.classList.remove("unwired");
    if (label) oval.setAttribute("aria-label", label);
  }
  /* Live Wx/Sensi ° — real live only; omit oval if not (never dash-degree) */
  function paintDanOvals() {
    wireOval(".hdr .oval.wx", null);
    wireOval(".hdr .oval.sensi", null);
    if (window.HouseWeather) {
      HouseWeather.load(function (err, data) {
        if (data && data.temp != null && isFinite(Number(data.temp))) {
          wireOval(".hdr .oval.wx", Math.round(data.temp) + "°", "Weather " + Math.round(data.temp) + " degrees", data.icon);
        } else {
          wireOval(".hdr .oval.wx", null);
        }
      });
    }
    if (window.HouseSensi) {
      HouseSensi.fetchLive(function (err, gate) {
        var st = HouseSensi.effectiveState();
        if (gate && gate.live && st && typeof st.ambient === "number") {
          wireOval(".hdr .oval.sensi", st.ambient + "°", "Sensi " + st.ambient + " degrees");
        } else {
          wireOval(".hdr .oval.sensi", null);
        }
      });
      HouseSensi.startPolling();
      HouseSensi.onChange(function (st) {
        if (st && st.gate && st.gate.live && typeof st.ambient === "number") {
          wireOval(".hdr .oval.sensi", st.ambient + "°", "Sensi " + st.ambient + " degrees");
        }
      });
    }
  }
  function paintBanner(data) {
    var sub = document.querySelector("[data-dan-banner-sub]");
    var title = document.querySelector(".banner-title");
    if (!data) return;
    var hw = data.homeWeek || {};
    if (title && hw.through) {
      title.textContent = "Kids with you @ 147th · through " + hw.through;
    }
    var strip = data.boardStrip || {};
    if (sub && strip.time && strip.place) {
      var lab = strip.label || "Next";
      sub.textContent = lab + " · " + strip.time + " " + strip.place;
    }
  }
  function paintDanDates() {
    if (!window.HouseClock) return;
    var s = HouseClock.now();
    document.querySelectorAll("[data-live='date-short']").forEach(function (el) {
      el.textContent = s.short || s.long || el.textContent;
    });
    document.querySelectorAll("[data-live='date-long']").forEach(function (el) {
      el.textContent = s.long || el.textContent;
    });
  }
  document.addEventListener("DOMContentLoaded", function () {
    paintDanDates();
    paintDanOvals();
    if (window.WardKids) WardKids.boot("dan");
  });
  document.addEventListener("house:kids-data-ready", function (ev) {
    try { paintBanner(ev.detail && ev.detail.data); } catch (e) { /* */ }
  });
})();
</script>
