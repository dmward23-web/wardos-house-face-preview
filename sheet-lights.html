<script>
(function () {
  var L = window.HouseLights;
  if (!L) return;
  var NEED = /NEED\s*(KEY|TOKEN)/i;
  function quiet(el) {
    if (!el) return;
    if (NEED.test(el.textContent || "")) { el.textContent = ""; el.classList.add("is-quiet"); el.setAttribute("aria-label", "Lights controls off on this screen"); }
    else if (el.textContent.trim()) { el.classList.remove("is-quiet"); el.removeAttribute("aria-label"); }
  }
  function paint() {
    var eff = L.effectiveLights();
    var g = eff.gate;
    var pill = document.getElementById("lights-status-pill");
    pill.textContent = g.label;
    pill.classList.remove("cmd-pill--live", "cmd-pill--off", "cmd-pill--need", "cmd-pill--stub", "on", "off");
    pill.classList.add("cmd-pill");
    if (g.live) pill.classList.add("cmd-pill--live");
    else if (g.needToken || g.kind === "need_token") pill.classList.add("cmd-pill--need");
    else pill.classList.add("cmd-pill--off");
    var box = document.getElementById("lights-connect");
    box.classList.toggle("ok", !!g.live);
    var title = document.getElementById("lights-connect-title");
    var sub = document.getElementById("lights-connect-sub");
    if (g.live) {
      title.textContent = "Lights · LIVE";
      sub.textContent = "Kasa lights on this screen";
    } else if (g.needToken || g.kind === "need_token") {
      title.textContent = "CONNECT · need Kasa on Atlas";
      sub.textContent = "Not connected yet · controls dark";
    } else {
      title.textContent = "Lights · " + g.label;
      sub.textContent = g.label + " · controls dark";
    }
    var ftr = document.getElementById("lights-ftr-status");
    if (ftr) ftr.textContent = g.label;
    quiet(pill); quiet(ftr); quiet(title); if (sub && NEED.test(sub.textContent || "")) sub.textContent = "Controls dark on this screen";
    var note = document.getElementById("lights-note");
    if (note && (g.needToken || g.kind === "need_token")) {
      note.textContent = "Not connected yet · controls dark";
    } else if (note && !g.live) {
      note.textContent = "Controls dark · lights offline";
    } else if (note && g.live) {
      note.textContent = "";
    }
    L.paintPads(document);
    Array.prototype.forEach.call(document.querySelectorAll(".light-pad-src, .light-pad-state"), quiet);
  }
  L.wireAllButtons(document);
  L.onChange(paint);
  L.startPolling();
  paint();
})();
</script>
